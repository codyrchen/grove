<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Barlow+Condensed:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet">
</head>
<body class="{% block body_class %}{% endblock %}" {% block body_attrs %}{% endblock %}>
  {% block nav %}
  <nav class="navbar navbar-expand navbar-dark grove-nav">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('dashboard') }}">
        <span class="brand-mark"><i class="bi bi-tree-fill"></i></span>
        <span class="fw-bold">{{ SITE_NAME }}</span>
      </a>
      <div class="navbar-nav ms-auto align-items-center gap-1">
        {% block nav_actions %}{% endblock %}
        <a class="nav-link" href="{{ url_for('about') }}" title="About">
          <i class="bi bi-info-circle d-sm-none"></i><span class="d-none d-sm-inline">About</span></a>
      </div>
    </div>
  </nav>
  {% endblock %}

  {% block body %}{% endblock %}

  {% block footer %}
  <footer class="text-center small text-muted py-4 px-3">
    {{ SITE_NAME }} is a student project. It is not affiliated with the University of Mississippi.
  </footer>
  {% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
